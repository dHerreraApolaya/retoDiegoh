name: Quality

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
  pull_request:
  push:
    branches: [main, 'feature/**', 'codex/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Reproducible installation
        run: pnpm install --frozen-lockfile
      - name: Toolchain, docs, formatting, lint, types, tests and secrets
        run: pnpm check
      - name: Conventional Commits in pull requests
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD"
      - name: Production and development dependency advisories
        run: pnpm audit:dependencies
