version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-native:
        patterns:
          ['react-native', '@react-native/*', '@react-native-community/cli*']
      react-native-firebase:
        patterns: ['@react-native-firebase/*']
      tanstack:
        patterns: ['@tanstack/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
